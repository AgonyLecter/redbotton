function tone(f,d=.1,type='sine',vol=.06,sl=0){try{const a=AC(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(mg);o.start();o.stop(n+d)}catch(e){}}

  const s=a.createBufferSource(),l=a.createBiquadFilter(),g=a.createGain();s.buffer=b;l.type='lowpass';l.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime);

  dlg.append(d);dlg.style.pointerEvents='auto';const go=()=>{const x=$('nm').value.trim()||'Tester';d.remove();dlg.style.pointerEvents='';r(x)};

const ctex=(w,h,fn,rep)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;fn(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=4;return t};
