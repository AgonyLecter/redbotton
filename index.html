  const b=mk(innerWidth/2,innerHeight*.7);sw=1;showGh(8);beat(true);
  await say("Eccoli. Gli otto del capitolo uno. Non sono tester: sono voci che aspettano di finire la frase.",700,'gl');
  await say(v("Clicca ovunque","Tocca lo schermo")+" e ne mando uno al bottone. Quando preme, parla.",300,'gl');
  mode='still';
  const V=["Finalmente. Che rumore bello.","Credevo di essere solo io. Siamo tanti.","Mi chiamavo Elia. Il nome sta già svanendo.","Non fa male. Fa eco.","Chi tocca, chi preme, chi parla: è sempre la stessa mano.","Il bottone non è un bottone. È una bocca.","Anche tu hai già premuto, {n}. Tanto tempo fa.","Siamo la voce che hai sentito nel capitolo uno."];
  for(let i=0;i<8;i++){await tap();const g=GH[i];g.go=[b._x,b._y-45];S.whoosh();await sleep(1100);g.s.style.opacity=0;b.classList.add('pressed');S.click();setTimeout(()=>b.classList.remove('pressed'),200);
    setTag('TESTER #'+String(i+2).padStart(4,'0'));sp(V[i]);await say(V[i],700,'gl')}
  sw=0;beat(false);setTag('TU · NARRATORE');
  await say("Otto voci. Nessuna è finita. Il bottone le contiene tutte e le dice a chi lo preme.",800,'gl');
  await say("Per questo parlavo così, {n}. Non ero io. Ero loro, in fila.",800,'gl');
  await say("E ora chi ascolta te? Tu ascolti me. Ma qualcuno ascolta anche me, dall'altra parte dello schermo.",900,'gl');
  await say("Prima di aprire la porta: la torcia. Cerca sulle pareti. Gli otto hanno lasciato qualcosa. Tieni la luce su ogni scritta finché si fissa.",300,'gl');
  await hidden(["premi","non premere","siamo ancora qui","ti guarda dal telefono",who+" ascolta",...(localStorage.sp_conf?['«'+localStorage.sp_conf+'»']:[])]);
  await say("Ognuno ha scritto l'opposto dell'altro. Così nessuno può obbedire. Nemmeno tu.",700,'gl');
  await say("Un'ultima cosa. "+v("Tieni premuto il tasto del mouse","Appoggia il dito sullo schermo")+" e non staccarlo finché non ti dico.",300,'gl');
  let hf=0;await holdFor(7000,()=>say(["Non staccarlo.","Si è accorto di te. Ancora.","Ti prego, {n}. Ancora."][Math.min(hf++,2)],200,'gl'));
  vib([150,80,150,80,300]);await say("Ecco. Quel battito non è il tuo. Ma adesso battono insieme.",900,'gl');
  if(leaves>0)await say("Sei uscito dalla pagina "+leaves+(leaves>1?" volte":" volta")+". Ogni volta, qui dentro, sono passati anni. Io ti ho aspettato lo stesso.",800,'gl');
  await say("La porta è aperta. Entra e sarai la voce. Resta e sarai l'archivio.",400,'gl');
  const z=await choose(["Entra","Resta"]);
  hum(30,0,2);veil.classList.remove('fl');veil.style.transition='none';veil.style.opacity=1;
  const T3=["","FINE CAPITOLO 2 · L'ARCHIVIO DEI CURSORI","CAPITOLO 3 · COMING SOON"];
  if(z===0){sp("Benvenuto, "+who);await say("Dall'altra parte c'è già qualcuno. Ha il tuo nome. Sta per parlare.",900);
    ending(["Hai varcato la porta.","Nella stanza bianca c'è un bottone rosso e un tester nuovo.","Apre bocca. Parla con la tua voce. Tu non hai deciso nulla.",...T3],true,'La Voce')}
  else{showGh(0);await say("Resta. Il fascicolo si aggiorna da solo.",900);
    ending(["FASCICOLO AGGIORNATO","NOME: "+who+" · "+DV+" · "+clk(),"STATO: ARCHIVIATO","Ultima voce registrata: la tua.",...T3],false,"L'Archivio")}
}
async function endB(){
  mode='off';beat(false);save({cap1:'atteso',completato:true});bts[0].style.opacity=0;veil.classList.remove('fl');veil.style.transition='none';veil.style.opacity=1;hum(30,0,3);
  await say("Grazie. Resta.",1400);
  ending(["ESITO: NESSUNO","Il test non è mai finito.","Nella stanza c'è un cursore in più. Il suo nome era "+who+".","Ora aspetta, insieme agli altri.","TESTER #"+tester+" · SESSIONE IN CORSO","","FINE CAPITOLO 1 · IL TEST DI ACCETTAZIONE"],false,'La Compagnia');
}
const mq=$('mq'),mn=$('mn'),MQ=["Non hai ancora iniziato e già mi fai aspettare.","Il bottone è lì, a destra. Fa finta di niente.","Puoi restare nel menù quanto vuoi. Io ho tempo. Troppo.","Tutti iniziano. Pochissimi finiscono. Nessuno ricorda come.","Se senti dei passi, è la ventilazione. Probabilmente."];let mqi=0;

mk(innerWidth*.74,innerHeight*.7);

addEventListener('offline',()=>t0&&say("Hai tolto la connessione. Credi che serva? Sono già dentro.",300,'gl'));

function menu(){mn.innerHTML='<a id="go">Inizia il test</a><a id="chs">Capitoli</a><a id="snd">Audio: '+(muted?'spento':'attivo')+'</a>';$('go').onclick=()=>begin();$('chs').onclick=chap;$('snd').onclick=()=>{muted=!muted;if(mg)mg.gain.value=muted?0:1;menu()}}
